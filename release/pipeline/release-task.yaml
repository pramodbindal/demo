---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: konflux-release-task
  annotations:
    tekton.dev/tags: release
spec:
  params:
    - name: APPLICATION
      type: string
    - name: ENVIRONMENT
      type: string
      default: stage
  results:
    - name: release-plan
    - name: snapshot
    - name: release
  stepTemplate:
    image: quay.io/openshift-pipeline/ci
    env:
      - name: APPLICATION
        value: $(params.APPLICATION)
      - name: ENVIRONMENT
        value: $(params.ENVIRONMENT)
  steps:
    - name: get-release-plan
      script: |
        export RELEASE_PLAN=$(
          oc get releaseplan -o json | jq -r --arg APP $APPLICATION '
          [
           .items[]
           | select(.spec.application == $APP and (.metadata.name | contains("stage")))
           |.metadata.name
          ]
          |.[-1]'
        )
        echo -n $RELEASE_PLAN | tee $(results.release-plan.path)

